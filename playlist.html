<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Playlist</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 10px;
      padding: 0;
      background: white;
    }
    
    /* Play All button */
    #playAll {
      font-family: Arial, sans-serif;
      font-size: 18px;
      font-weight: bold;
      min-height: 48px;
      padding: 10px 18px;
      margin: 0 0 12px 0;
      background: #1E6C93;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #playAll:hover {
      background: #3367d6;
    }
    
    /* Audio player */
    audio {
      display: block;
      width: 100%;
      min-height: 48px;
      margin: 0 0 12px 0;
    }
    
    /* Playlist */
    #playlist {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    
    /* Individual song - large touch target */
    #playlist li {
      min-height: 44px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
    
      padding: 10px 12px;
      margin: 4px 0;
    
      background: #f0f0f0;
      cursor: pointer;
      border-radius: 5px;
    
      font-size: 16px;
      line-height: 1.3;
    }
    
    /* Mouse hover */
    #playlist li:hover {
      background: #ddd;
    }
    
    /* Currently playing */
    #playlist li.active {
      background: #1E6C93;
      color: white;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <button id="playAll">▶ Play All</button>
  <audio id="player" controls preload="metadata"></audio>
  <ul id="playlist">
    <li data-src="01 One Brave Step (one long song).mp3"> 01 One Brave Step (one
      long song) </li>
    <li data-src="02 Same Old Bench.mp3"> 02 Same Old Bench </li>
    <li data-src="03 Let the moment be.mp3"> 03 Let the Moment Be </li>
    <li data-src="04 Just The View.mp3"> 04 Just The View </li>
    <li data-src="05 The Invisible Man.mp3"> 05 The Invisible Man </li>
    <li data-src="06 Constellations.mp3"> 06 Constellations </li>
    <li data-src="07 See You Tomorrow.mp3"> 07 See You Tomorrow </li>
  </ul>
  <script>
    const player = document.getElementById("player");
    const tracks = Array.from(document.querySelectorAll("#playlist li"));
    const playAllButton = document.getElementById("playAll");
    let currentTrack = 0;
    let playAll = false;
    // Play a particular track.
    function playTrack(index) {
      currentTrack = index;
      player.src = tracks[index].dataset.src;
      tracks.forEach(track => {
        track.classList.remove("active");
      });
      tracks[index].classList.add("active");
      player.play();
    }
    // Play All button.
    playAllButton.addEventListener("click", function() {
      if (playAll) {
        // Stop Play All mode.
        playAll = false;
        player.pause();
        playAllButton.textContent = "▶ Play All";
      } else {
        // Start from Song 1.
        playAll = true;
        playAllButton.textContent = "■ Stop All";
        playTrack(0);
      }
    });
    // Automatically play the next track when the
    // current track finishes.
    player.addEventListener("ended", function() {
      if (playAll) {
        if (currentTrack < tracks.length - 1) {
          playTrack(currentTrack + 1);
        } else {
          // Last song has finished.
          playAll = false;
          playAllButton.textContent = "▶ Play All";
        }
      }
    });
    // Allow the user to select an individual song.
    tracks.forEach((track, index) => {
      track.addEventListener("click", function() {
        // Selecting a song manually exits Play All mode.
        playAll = false;
        playAllButton.textContent = "▶ Play All";
        playTrack(index);
      });
    });
    // Load Song 1 without playing it.
    player.src = tracks[0].dataset.src;
    tracks[0].classList.add("active");
  </script>
</body>

</html>
