<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Audio Playlist</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      /* min-height: 100%;
      height: auto;
      overflow: visible;*/
    }

    #playAll {
      font-family: Arial, sans-serif;
      font-size: 16px;
      padding: 10px 18px;
      margin-bottom: 15px;
      background: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    #playAll:hover {
      background: #3367d6;
    }

    audio {
      width: 100%;
      margin-bottom: 15px;
    }

    #playlist {
      list-style: none;
      padding: 0;
    }

    #playlist li {
      padding: 10px;
      margin: 4px 0;
      background: #f0f0f0;
      cursor: pointer;
      border-radius: 4px;
    }

    #playlist li:hover {
      background: #ddd;
    }

    #playlist li.active {
      background: #4285f4;
      color: white;
    }
  </style>
</head>

<body>
  <h2>Audio Playlist 2</h2>
  <button id="playAll">▶ Play All</button>
  <audio id="player" controls></audio>
  <ul id="playlist">
    <li data-src="01 One Brave Step (one long song).mp3"> 01 One Brave Step (one
      long song) </li>
    <li data-src="02 Same Old Bench.mp3"> 02 Same Old Bench </li>
    <li data-src="03 Let the moment be.mp3"> 03 Let the Moment Be </li>
    <li data-src="04 Just The View.mp3"> 04 Just The View </li>
    <li data-src="05 The Invisible Man.mp3"> 05 The Invisible Man </li>
    <li data-src="06 Constellations.mp3"> 06 Constellations </li>
    <li data-src="07 See You Tomorrow.mp3"> 07 See You Tomorrow </li>
  </ul>
  <script>
    const player = document.getElementById("player");
    const tracks = Array.from(document.querySelectorAll("#playlist li"));
    const playAllButton = document.getElementById("playAll");
    let currentTrack = 0;
    // True only when Play All has been activated.
    let playAll = false;

    function playTrack(index) {
      currentTrack = index;
      player.src = tracks[index].dataset.src;
      tracks.forEach(track => track.classList.remove("active"));
      tracks[index].classList.add("active");
      player.play();
    }
    // PLAY ALL BUTTON
    playAllButton.addEventListener("click", function() {
      if (playAll) {
        // Stop Play All mode.
        playAll = false;
        player.pause();
        playAllButton.textContent = "▶ Play All";
      } else {
        // Start Play All mode from Song 1.
        playAll = true;
        playAllButton.textContent = "■ Stop All";
        playTrack(0);
      }
    });
    // When a song ends, automatically play the next song
    // only when Play All mode is active.
    player.addEventListener("ended", function() {
      if (playAll && currentTrack < tracks.length - 1) {
        playTrack(currentTrack + 1);
      } else if (playAll && currentTrack === tracks.length - 1) {
        // Last song has finished.
        playAll = false;
        playAllButton.textContent = "▶ Play All";
      }
    });
    // Allow the user to select an individual song.
    tracks.forEach((track, index) => {
      track.addEventListener("click", function() {
        // Selecting an individual song cancels Play All mode.
        playAll = false;
        playAllButton.textContent = "▶ Play All";
        playTrack(index);
      });
    });
    // Load the first track without automatically playing it.
    player.src = tracks[0].dataset.src;
    tracks[0].classList.add("active");
  </script>
</body>

</html>
