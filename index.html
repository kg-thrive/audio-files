<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Audio Recordings</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      color: #222;
    }

    .audio-item {
      margin-bottom: 25px;
    }

    .audio-title {
      font-weight: bold;
      margin-bottom: 8px;
    }

    audio {
      width: 100%;
    }
  </style>
</head>

<body>

  <div class="audio-item">
    <div class="audio-title">01 One Brave Step (one long song)</div>
    <audio controls preload="metadata">
      <source src="01 One Brave Step (one long song).mp3" type="audio/mpeg">
    </audio>
  </div>

  <div class="audio-item">
    <div class="audio-title">02 Same Old Bench</div>
    <audio controls preload="metadata">
      <source src="02 Same Old Bench.mp3" type="audio/mpeg">
    </audio>
  </div>

  <div class="audio-item">
    <div class="audio-title">03 Let the moment be</div>
    <audio controls preload="metadata">
      <source src="03 Let the moment be.mp3" type="audio/mpeg">
    </audio>
  </div>

  <div class="audio-item">
    <div class="audio-title">04 Just The View</div>
    <audio controls preload="metadata">
      <source src="04 Just The View.mp3" type="audio/mpeg">
    </audio>
  </div>

  <div class="audio-item">
    <div class="audio-title">05 The Invisible Man</div>
    <audio controls preload="metadata">
      <source src="05 The Invisible Man.mp3" type="audio/mpeg">
    </audio>
  </div>

  <div class="audio-item">
    <div class="audio-title">06 Constellations</div>
    <audio controls preload="metadata">
      <source src="06 Constellations.mp3" type="audio/mpeg">
    </audio>
  </div>

  <div class="audio-item">
    <div class="audio-title">07 See You Tomorrow</div>
    <audio controls preload="metadata">
      <source src="07 See You Tomorrow.mp3" type="audio/mpeg">
    </audio>
  </div>

</body>
</html>
